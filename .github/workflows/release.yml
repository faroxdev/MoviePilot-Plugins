name: Plugin Release
"on":
  push:
    paths:
      - 'package.v2.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip

      - name: Build and release changed plugins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Track processed tags to avoid duplicates across package files
          : > processed_tags.txt

          process_package() {
            local pkg_file="$1"
            [ -f "$pkg_file" ] || return 0

            echo "Processing $pkg_file"

            # Extract entries with release == true: output format KEY|VERSION
            mapfile -t entries < <(jq -r 'to_entries | map(select(.value.release == true)) | .[] | "\(.key)|\(.value.version)"' "$pkg_file")

            if [ "${#entries[@]}" -eq 0 ]; then
              echo "No plugins with release=true in $pkg_file"
              return 0
            fi

            for entry in "${entries[@]}"; do
              plugin_id="${entry%%|*}"
              plugin_version="${entry##*|}"
              plugin_id_lc="$(echo "$plugin_id" | tr '[:upper:]' '[:lower:]')"

              plugin_dir="plugins.v2/${plugin_id_lc}"

              if [ ! -d "$plugin_dir" ]; then
                echo "WARN: directory for $plugin_id not found under plugins/ or plugins.v2/, skip."
                continue
              fi

              tag="${plugin_id}_v${plugin_version}"
              asset="${plugin_id_lc}_v${plugin_version}.zip"

              if grep -qxF "$tag" processed_tags.txt; then
                echo "Tag $tag already processed, skip."
                continue
              fi

              # 已发布版本保持不变；新版本必须使用新的版本号和 Tag。
              if gh release view "$tag" >/dev/null 2>&1; then
                echo "Release $tag already exists, skip."
                echo "$tag" >> processed_tags.txt
                continue
              fi

              # Find previous tag for this plugin (any version)
              prev_tag="$(git tag --list "${plugin_id}_v*" --sort=-version:refname | grep -vxF "$tag" | head -n 1 || true)"

              changed=1
              if [ -n "$prev_tag" ]; then
                if git diff --quiet "$prev_tag" -- "$plugin_dir"; then
                  changed=0
                fi
              fi

              if [ "$changed" -eq 0 ]; then
                echo "No changes in $plugin_dir since $prev_tag, skip packaging $plugin_id."
                echo "$tag" >> processed_tags.txt
                continue
              fi

              echo "Packing $plugin_id from $plugin_dir -> $asset"
              rm -f "$asset"
              package_parent="$(dirname "$plugin_dir")"
              package_name="$(basename "$plugin_dir")"
              staging_dir=""

              if [ "$plugin_id" = "Downloader115FastUpload" ]; then
                # 固定上游提交，保证构建可复现；插件运行时会按容器架构自动选择。
                fake115_commit="e65268c005dc997ab4365c47cb6968dca2ea0f44"
                staging_dir="$(mktemp -d)"
                source_dir="$(mktemp -d)"
                cp -a "$plugin_dir" "$staging_dir/$package_name"
                mkdir -p "$staging_dir/$package_name/bin" "$staging_dir/$package_name/third_party"
                git clone --quiet https://github.com/orzogc/fake115uploader.git "$source_dir"
                git -C "$source_dir" checkout --quiet "$fake115_commit"
                for arch in amd64 arm64; do
                  echo "Building fake115uploader linux/$arch at $fake115_commit"
                  (
                    cd "$source_dir"
                    CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
                      go build -trimpath -ldflags="-s -w" \
                      -o "$staging_dir/$package_name/bin/fake115uploader-linux-$arch" .
                  )
                done
                cp "$source_dir/LICENSE" \
                  "$staging_dir/$package_name/third_party/fake115uploader.LICENSE"
                git -C "$source_dir" archive --format=tar.gz \
                  --output="$staging_dir/$package_name/third_party/fake115uploader-source.tar.gz" \
                  "$fake115_commit"
                package_parent="$staging_dir"
              fi

              (
                cd "$package_parent"
                zip -r "$GITHUB_WORKSPACE/$asset" "$package_name" \
                  -x "*/__pycache__/*" -x "*.pyc"
              ) >/dev/null

              if [ -n "$staging_dir" ]; then
                rm -rf "$staging_dir" "$source_dir"
              fi

              echo "Creating release $tag"
              jq -r --arg id "$plugin_id" --arg version "v$plugin_version" \
                '.[$id].history[$version] // "Plugin release"' "$pkg_file" > release_notes.txt
              if [ "$plugin_id" = "Downloader115FastUpload" ]; then
                echo >> release_notes.txt
                cat README.md >> release_notes.txt
              fi
              gh release create "$tag" "$asset" --title "$tag" \
                --notes-file release_notes.txt --latest --target "$GITHUB_SHA"

              echo "$tag" >> processed_tags.txt
            done
          }

          process_package "package.v2.json"
